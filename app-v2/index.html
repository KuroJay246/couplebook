    />
    <script>
      (() => {
        const key = 'couplebook:appearance-theme'
        const allowed = new Set(['midnight-rose', 'paper-hearts', 'moonlit'])
        let theme = 'midnight-rose'
        try {
          const stored = String(window.localStorage.getItem(key) || '').trim().toLowerCase()
          if (allowed.has(stored)) theme = stored
        } catch {}
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <div id="root"></div>
